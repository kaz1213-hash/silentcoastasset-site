[build]
  command = "node scripts/site-release-gate.cjs build"
  publish = "public-build"

[build.environment]
  NODE_VERSION = "22"

# Privacy-friendly click-through hop: count requests in Netlify Observability, no browser analytics.
[[redirects]]
  from = "/go/project-vault"
  to = "https://chromewebstore.google.com/detail/project-vault-for-chatgpt/lnndbebmjnklgammhjmgpdaijdcmighl"
  status = 302
  force = true


# All FairValue static pages, when explicitly approved for production.
# Prelaunch deploy previews remain SSO-protected + meta noindex.
[[headers]]
  for = "/fairvalue/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cyberjapandata.gsi.go.jp; connect-src 'self' https://cyberjapandata.gsi.go.jp"
