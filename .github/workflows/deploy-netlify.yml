name: Deploy SCA to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sca-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy production
        run: >
          npx --yes netlify-cli@27.16.2 deploy
          --prod
          --dir public-build
          --site 6bc33721-1646-442c-9934-28ccbcc0a7c1
          --auth "$NETLIFY_AUTH_TOKEN"
          --message "GitHub Actions ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
